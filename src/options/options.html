<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Static Remover options</title>
<style>
  body { font-family: system-ui, -apple-system, sans-serif; max-width: 560px; margin: 32px auto; padding: 0 16px; color: #111; background: #fff; }
  h1 { font-size: 20px; font-weight: 600; }
  label { display: block; margin: 20px 0 4px; font-size: 14px; }
  input[type="range"] { width: 100%; }
  output { font-size: 13px; color: #444; }
  p.hint { font-size: 13px; color: #555; }
</style>
</head>
<body>
<h1>Static Remover</h1>
<label for="alpha">Removal strength</label>
<input id="alpha" type="range" min="0.5" max="4" step="0.1" value="1.0">
<output id="alphaOut" for="alpha"></output>
<label for="floor">Maximum suppression (dB)</label>
<input id="floor" type="range" min="6" max="30" step="1" value="12">
<output id="floorOut" for="floor"></output>
<p class="hint" id="shortcut"></p>
<p class="hint">Click the toolbar icon to toggle cleaning on the current YouTube tab. Changes apply to the playing video immediately.</p>
<script src="options.js"></script>
</body>
</html>
